name: Build

on: push

permissions:
  contents: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y -o Acquire::Retries=50 \
                           build-essential gcc-aarch64-linux-gnu iasl \
                           mtools lzma-dev python3 uuid-dev zip

      - name: Sources (git)
        run: |
          make submodules

      - name: Sources (firmware)
        run: |
          make firmware

      - name: Build (EFI)
        run: |
          make efi

      - name: Build (iPXE)
        run: |
          make ipxe -j 4

      - name: SD card
        run: |
          make

      - name: Create release
        if: startsWith(github.event.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
             --title "${GITHUB_REF_NAME}" \
             sdcard.img sdcard.zip
